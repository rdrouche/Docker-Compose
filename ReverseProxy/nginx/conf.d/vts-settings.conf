# name: vts-settings.conf
# description: permet l activation du module VTS - requis pour Nginx Dashboard
# require:
# version: 1.0.0

vhost_traffic_status_zone shared:ngx_http_vhost_traffic_status:128m;

# By Country
#vhost_traffic_status_filter_by_set_key $geoip2_data_country_iso_code country::*;

# By types (Humans or Bots)
#vhost_traffic_status_filter_by_set_key $is_bot bots::*;