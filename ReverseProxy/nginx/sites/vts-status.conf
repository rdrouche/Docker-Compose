server {
    listen 8080;
    server_name _;

    # Accès restreint réseau Docker interne uniquement
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    # Desactive VTS pour le virtualhost
    vhost_traffic_status off;

    location /status {
        vhost_traffic_status_display;
        vhost_traffic_status_display_format html;
    }

    location /status.json {
        vhost_traffic_status_display;
        vhost_traffic_status_display_format json;
    }
}
