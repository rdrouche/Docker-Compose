# name: global-error
# description: permet l interception des erreurs http et presenter une page d erreur personnaliser a l aide de tarampampam/error-pages
# emplacement: server,location
# require: service docker error-pages up
# version: 1.0.0

# Global Error Config
proxy_intercept_errors on;
error_page 400 401 403 404 405 500 502 503 504 /error-pages;

#location @fallback {
location = /error-pages {
    set $upstream_errors error-pages;
    resolver 127.0.0.11 valid=30s;
    proxy_pass http://$upstream_errors:8080;
    proxy_set_header X-Code $status;
    proxy_set_header X-Original-URI $request_uri;
    proxy_intercept_errors off;
    internal;
}
