services:
  app:
    image: excalidraw/excalidraw:latest
    restart: "no"
    networks:
      - proxy
    tmpfs:
      - /tmp:size=32m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-0.5}"
          memory: "${MEM_LIMIT:-256m}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.app-${INSTANCE_ID}.rule=Host(`${INSTANCE_ID}.${APP_DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.app-${INSTANCE_ID}.tls=false"
      - "traefik.http.routers.app-${INSTANCE_ID}.entrypoints=web"
      - "traefik.http.services.app-${INSTANCE_ID}.loadbalancer.server.port=${APP_PORT:-80}"
      - "traefik.http.middlewares.app-${INSTANCE_ID}-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.app-${INSTANCE_ID}-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.routers.app-${INSTANCE_ID}.middlewares=app-${INSTANCE_ID}-headers"

networks:
  proxy:
    external: true
