---
name: conductor

services:
  init-perms:
    image: alpine:3.20
    user: root
    restart: "no"
    network_mode: none
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/conductor
        chown -R 1000:1000 /data /stacks
    volumes:
      - ./data:/data
      - ./stacks:/stacks

  conductor:
    image: forge.rdr-it.com/registry/conductor/admin:${ADMIN_TAG:-latest}
    restart: ${RESTART_POLICY:-unless-stopped}
    container_name: conductor
    user: ${CONDUCTOR_USER:-1000:1000}
    env_file:
      - conductor.env
    environment:
      STACKS_DIR: ${STACKS_DIR:-/stacks}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - ./data/conductor:/app/data
      - ./stacks:/stacks
    ports:
      - ${CONDUCTOR_PORT_PUBLISH:-3000}:3000
    networks:
      - net-conductor

  redis:
    image: redis:7-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - net-conductor
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  net-conductor:
    name: net-conductor
    driver: bridge

volumes:
  redis_data:

  