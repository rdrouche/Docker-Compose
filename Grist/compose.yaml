services:
  grist:
    image: gristlabs/grist:${GRIST_TAG:-latest}
    env_file:
      - .env
    environment:
      - APP_HOME_URL=${GRIST_URL}
      - GRIST_DEFAULT_EMAIL=${GRIST_DEFAULT_EMAIL:-grist@domain.tld}
      - GRIST_FORCE_LOGIN=${GRIST_FORCE_LOGIN:-false}
      # Database
      - TYPEORM_DATABASE=${POSTGRES_DB:-grist}
      - TYPEORM_USERNAME=${POSTGRES_USER:-grist}
      - TYPEORM_PASSWORD=${POSTGRES_PASSWORD}
      - TYPEORM_TYPE=postgres
      - TYPEORM_HOST=grist-db
      - TYPEORM_PORT=5432
      - TYPEORM_LOGGING=false
      # Redis
      - REDIS_URL=redis://grist-redis
    volumes:
      - ${VOLUME_PATH}grist:/persist
    ports:
      - "8484:8484"
    depends_on:
      - grist-db
      - grist-redis
    labels:
      - "locator.service_id=Grist"
      - "locator.description="
      - "locator.url.0.label=Interface"
      - "locafor.url.href=${GRIST_URL}"

  grist-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-grist}
      - POSTGRES_USER=${POSTGRES_USER:-grist}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data

  grist-redis:
    image: redis:alpine
    volumes:
      - ${VOLUME_PATH}redis:/data
