version: '3.8'

services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${VERSION}
    container_name: es01
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      node.name: es01
      cluster.name: docker-cluster
      discovery.seed_hosts: es02
      cluster.initial_master_nodes: es01,es02
      bootstrap.memory_lock: true
      ES_JAVA_OPTS: "-Xms2G -Xmx2G"
      ELASTIC_PASSWORD: $ELASTIC_PWD
      xpack.security.enabled: true
      xpack.security.http.ssl.enabled: true
      xpack.security.http.ssl.key: $CERTS_DIR/es01/es01.key
      xpack.security.http.ssl.certificate_authorities: $CERTS_DIR/ca/ca.crt
      xpack.security.http.ssl.certificate: $CERTS_DIR/es01/es01.crt
      xpack.security.transport.ssl.enabled: true 
      xpack.security.transport.ssl.verification_mode: certificate 
      xpack.security.transport.ssl.certificate_authorities: $CERTS_DIR/ca/ca.crt
      xpack.security.transport.ssl.certificate: $CERTS_DIR/es01/es01.crt
      xpack.security.transport.ssl.key: $CERTS_DIR/es01/es01.key
    volumes:
      - type: bind
        source: ./es01/config/elasticsearch.yml
        target: /usr/share/elasticsearch/config/elasticsearch.yml
        read_only: true
      - ./data/es01:/usr/share/elasticsearch/data
      - certs:$CERTS_DIR
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${VERSION}
    container_name: es02
    restart: always
    environment:
      node.name: es02
      cluster.name: docker-cluster
      discovery.seed_hosts: es01
      cluster.initial_master_nodes: es01,es02
      bootstrap.memory_lock: true
      ES_JAVA_OPTS: "-Xms2G -Xmx2G"
      ELASTIC_PASSWORD: $ELASTIC_PWD
      xpack.security.enabled: true
      xpack.security.http.ssl.enabled: true
      xpack.security.http.ssl.key: $CERTS_DIR/es02/es02.key
      xpack.security.http.ssl.certificate_authorities: $CERTS_DIR/ca/ca.crt
      xpack.security.http.ssl.certificate: $CERTS_DIR/es02/es02.crt
      xpack.security.transport.ssl.enabled: true 
      xpack.security.transport.ssl.verification_mode: certificate 
      xpack.security.transport.ssl.certificate_authorities: $CERTS_DIR/ca/ca.crt
      xpack.security.transport.ssl.certificate: $CERTS_DIR/es02/es02.crt
      xpack.security.transport.ssl.key: $CERTS_DIR/es02/es02.key
    volumes:
      - type: bind
        source: ./es02/config/elasticsearch.yml
        target: /usr/share/elasticsearch/config/elasticsearch.yml
        read_only: true
      - ./data/es02:/usr/share/elasticsearch/data
      - certs:$CERTS_DIR
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic

  kib01:
    image: docker.elastic.co/kibana/kibana:${VERSION}
    container_name: kib01
    restart: always
    ports: 
      - 5601:5601
    environment:
      ELASTICSEARCH_URL: https://es01:9200
      ELASTICSEARCH_HOSTS: '["https://es01:9200","https://es02:9200"]'
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: $CERTS_DIR/ca/ca.crt
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: $ELASTIC_PWD
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY: $CERTS_DIR/kib01/kib01.key
      SERVER_SSL_CERTIFICATE: $CERTS_DIR/kib01/kib01.crt
    volumes:
      - type: bind
        source: ./kib01/config/kibana.yml
        target: /usr/share/kibana/config/kibana.yml
        read_only: true
      - certs:$CERTS_DIR
    networks:
      - elastic

volumes:
  certs:
    driver: local

networks:
  elastic:
    driver: bridge
