# name: private-ips
# description: permet de mapper les adresses ip privees pour filtrage
# require:
# usage: utiliser avec allow-visit-xxx - permet d autoriser les ips privees
# version: 1.0.0

geo $is_private_ip {
    default 0;

    10.0.0.0/8        1;
    172.16.0.0/12     1;
    192.168.0.0/16    1;
    127.0.0.0/8       1;
    169.254.0.0/16    1;
    ::1               1;
    fc00::/7          1;
}