server{
    server_name opencloud-collabora.domain.tld;
    listen 443 ssl;

    error_log /var/log/nginx/opencloud-collabora.domain.tld.error.log;
    access_log /var/log/nginx/opencloud-collabora.domain.tld.access.log;

    ssl_certificate /ssl/domain.tld.pem;
    ssl_certificate_key /ssl/domain.tld.key;

    # Disable security
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # Fix error 414 large header
    client_header_buffer_size 128k;
    large_client_header_buffers 4 128k;

    proxy_buffering off;
    proxy_request_buffering off;

    # Important pour les gros documents
    client_max_body_size 0;


    set $backend http://127.0.0.1:9980;

    # static files
    location ^~ /browser {
      proxy_pass $backend;
      proxy_set_header Host $host;
    }

    # WOPI discovery URL
    location ^~ /hosting/discovery {
      proxy_pass $backend;
      proxy_set_header Host $host;
    }

    # Capabilities
   location ^~ /hosting/capabilities {
     proxy_pass $backend;
     proxy_set_header Host $host;
   }

   location ~ ^/cool/(.*)/ws$ {
     proxy_pass $backend;
     proxy_set_header Upgrade $http_upgrade;
     proxy_set_header Connection "Upgrade";
     proxy_set_header Host $host;
     proxy_set_header X-Forwarded-Proto $scheme;
     proxy_read_timeout 36000s;
   }

   # download, presentation and image upload
   location ~ ^/cool {
     proxy_pass $backend;
     proxy_set_header Host $host;
   }
}
