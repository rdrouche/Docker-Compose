---
services:
  opencloud:
    image: opencloudeu/opencloud-rolling:${OC_IMAGE_TAG:-6.0.0}
    restart: ${RESTART_POLICY:-always}
    user: ${OC_USER:?Define user}
    networks:
      - opencloud-net
      # Add network reverse proxy bellow
    ports:
      - "${OC_EXTERNAL_PORT:-9200}:9200"
    entrypoint:
      - /bin/sh
    command: ["-c", "opencloud init || true; opencloud server"]
    env_file:
      - .env
    environment:
      - OC_URL=https://${OC_DOMAIN:?Define domain for OpenCloud}
      - OC_INSECURE=${OC_INSECURE:-true}
      - PROXY_TLS=${PROXY_TLS:-false}
      - OC_DEFAULT_LANGUAGE=${OC_DEFAULT_LANGUAGE:-en}
      - IDM_ADMIN_PASSWORD=${IDM_ADMIN_PASSWORD:?Configure the admin password}
      # FOR COLLOBORA
      - COLLABORA_DOMAIN=${COLLABORA_DOMAIN}
      - NATS_NATS_HOST=0.0.0.0
      - GATEWAY_GRPC_ADDR=0.0.0.0:9142
    volumes:
      - ./config/opencloud/csp.yaml:/etc/opencloud/csp.yaml
      - ./opencloud-config:/etc/opencloud
      - ./opencloud-data:/var/lib/opencloud
      - ./opencloud-apps:/var/lib/opencloud/web/assets/apps
      # Uncomment if you want use clamav
      #- clamav-socket:/var/run/clamav

  collaboration:
    image: opencloudeu/opencloud-rolling:${OC_IMAGE_TAG:-6.0.0}
    restart: ${RESTART_POLICY:-always}
    user: ${OC_USER:?Define user}
    networks:
      - opencloud-net
      # Add network reverse proxy bellow
    ports:
      - "${COLLOBORATION_EXTERNAL_PORT:-9300}:9300"
    entrypoint:
      - /bin/sh
    command: [ "-c", "opencloud collaboration server" ]
    env_file:
      - .env
    environment:
      - COLLABORATION_GRPC_ADDR=0.0.0.0:9301
      - COLLABORATION_HTTP_ADDR=0.0.0.0:9300
      - MICRO_REGISTRY=nats-js-kv
      - MICRO_REGISTRY_ADDRESS=opencloud:9233
      - COLLABORATION_WOPI_SRC=https://${WOPI_DOMAIN:?Define domain for OpenCloud WOPI}
      - COLLABORATION_APP_ADDR=https://${COLLABORA_DOMAIN}
      - COLLABORATION_APP_ICON=https://${COLLABORA_DOMAIN}/favicon.ico
      - COLLABORATION_APP_NAME=CollaboraOnline
      - COLLABORATION_APP_PRODUCT=Collabora
      - COLLABORATION_APP_INSECURE=${OC_INSECURE:-true}
      - COLLABORATION_CS3API_DATAGATEWAY_INSECURE=${OC_INSECURE:-true}
      - COLLABORATION_LOG_LEVEL=${OC_LOG_LEVEL}
      - OC_URL=https://${OC_DOMAIN}
    volumes:
      - ./opencloud-config:/etc/opencloud
    depends_on:
      opencloud:
        condition: service_started
      collabora:
        condition: service_healthy

  collabora:
    image: collabora/code:${COLLABORA_IMAGE_TAG:-25.04.9.4.1}
    #image: collabora-code-custom
    #pull_policy: never
    restart: always
    entrypoint: [ '/bin/bash', '-c' ]
    command: [ 'coolconfig generate-proof-key && /start-collabora-online.sh' ]
    networks:
      - opencloud-net
      # Add network reverse proxy bellow
    ports:
      - "9980:9980"
    env_file:
      - .env
    environment:
      - aliasgroup1=https://.*:443
      - domain1:${WOPI_DOMAIN}
      - DONT_GEN_SSL_CERT=${DONT_GEN_SSL_CERT:-YES}
      - username=${COLLABORA_ADMIN_USER:?Define username for COLLABORA_ADMIN_USER}
      - password=${COLLABORA_ADMIN_PASSWORD?Define username for COLLABORA_ADMIN_PASSWORD}
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:welcome.enable=false --o:home_mode.enable=false
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor:unconfined
    volumes:
      - /usr/share/fonts/truetype:/usr/share/fonts/truetype/more:ro
      - /usr/share/fonts/truetype:/opt/cool/systemplate/usr/share/fonts/truetype/more:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9980/hosting/discovery" ]
      interval: 15s
      timeout: 10s
      retries: 5


  tika:
    # Search Engine
    image: apache/tika:${TIKA_IMAGE_TAG:-latest}
    restart: always
    profiles: ["search", "all"]
    networks:
      - opencloud-net
    deploy:
      resources:
        limits:
          memory: ${TIKA_MEMORY_LIMIT:-512m}
  
  clamav:
    image: clamav/clamav:latest
    restart: always
    profiles: ["av", "all"]
    networks:
      - opencloud-net
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
    volumes:
      - clamav-socket:/tmp
      - clamav-db:/var/lib/clamav

# For use volume uncomment bellow and remove ./ in volumes
#volumes:
#  opencloud-config:
#  opencloud-data:
#  clamav-db:
#  clamav-socket:

networks:
  opencloud-net:
  # Add network reverse proxy bellow