services:
  db:
    image: mariadb:${MARIADB_VERSION:-11}
    container_name: guacamole_db
    hostname: guacamole_db    
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - guacamole-net
    env_file:
      - env/db.env
    volumes:
      - ./guacamole_db:/var/lib/mysql
    expose:
      - 3306
    
  guacd:
    image: guacamole/guacd:${GUACD_VERSION:-latest}
    container_name: guacd
    hostname: guacd    
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - guacamole-net
    env_file:
      - guacamole.env
    volumes:
      - ./guacd_drive:/drive:rw 
      - ./guacd_record:/record:rw 
    expose:
      - 4822

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION:-latest}
    container_name: guacamole
    hostname: guacamole
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - guacamole-net
    env_file:
      - guacamole.env
    depends_on:
      - guacamole_db
      - guacd
    ports:
      - ${GUACAMOLE_PORT:-8080}:8080
    links:
      - guacd
    environment:
      - MYSQL_HOSTNAME=${MYSQL_HOSTNAME:-guacamole_db}
      - GUACD_HOSTNAME=${GUACD_HOSTNAME:-guacd}

networks:
  guacamole-net:
    name: guacamole-net