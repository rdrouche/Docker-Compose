---
name: guacamole

services:
  db:
    image: mariadb:${MARIADB_VERSION:-11}
    container_name: ${MYSQL_HOSTNAME:-guacamole_db}
    hostname: ${MYSQL_HOSTNAME:-guacamole_db}
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - guacamole-net
    env_file:
      - env/db.env
    volumes:
      - ./guacamole_db:/var/lib/mysql
    expose:
      - 3306
    
  guacd:
    image: guacamole/guacd:${GUACD_VERSION:-latest}
    container_name: guacd
    hostname: guacd    
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - guacamole-net
    env_file:
      - env/guacd.env
    volumes:
      - ${GUACD_PATH_DRIVE:-./data/guacd/drive}:/drive:rw 
      - ${GUACD_PATH_RECORD:-./data/guacd/record}:/record:rw
    expose:
      - 4822

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION:-latest}
    container_name: guacamole
    hostname: guacamole
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - guacamole-net
    env_file:
      - env/guacamole.env
      - env/db.env
    depends_on:
      - db
      - guacd
    ports:
      - ${GUACAMOLE_PORT:-8080}:8080
    links:
      - guacd
    volumes:
      - ${GUACD_PATH_RECORD:-./data/guacd/record}:/record:rw
    environment:
      MYSQL_HOSTNAME: ${MYSQL_HOSTNAME:-guacamole_db}
      GUACD_HOSTNAME: ${GUACD_HOSTNAME:-guacd}

networks:
  guacamole-net:
    name: guacamole-net