app:
  name: Apache Guacamole
  description: Passerelle RDP / SSH / VNC dans le navigateur
  tags: [accès distant, rdp, ssh]
stacks:
  mysql: MySQL
  postgres: PostgreSQL 
vars:
  RESTART_POLICY:
    type: select
    options:
      - { value: "always",          label: "always" }
      - { value: "unless-stopped",  label: "unless-stopped" }
    default: unless-stopped
    required: true
  TZ:
    default: UTC
  GUACD_VERSION:
    type: text
    default: latest