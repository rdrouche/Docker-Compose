app:
  name: Apache Guacamole
  description: Passerelle RDP / SSH / VNC dans le navigateur
  tags: [accès distant, rdp, ssh]
stacks:
  mysql: MySQL
  postgres: PostgreSQL 
vars:
  RESTART_POLICY:
    type: select
    options:
      - { value: "always",          label: "always" }
      - { value: "unless-stopped",  label: "unless-stopped" }
    default: unless-stopped
    required: true
  TZ:
    default: UTC
  GUACD_VERSION:
    type: text
    default: latest
  GUACAMOLE_VERSION:
    type: text
    default: latest
  GUACAMOLE_PORT:
    type: port 
    default: 8080
  GUACD_HOSTNAME:
    type: text
    default: guacd
    required: true
    group: Guacamole config
    services:
      - guacamole
  REMOTE_IP_VALVE_ENABLED:
    type: bool
    default: true
    label: Permet de recuperer IP du visiteur quand Guacamole est derriere un reverse proxy
    group: Guacamole config
    services:
      - guacamole
  RECORDING_ENABLED:
    type: bool 
    default: true
    label: Active le module qui permet l enregistrement video des sessions
  RECORDING_SEARCH_PATH:
    type: path 
    default: /record
    label: Emplacement a l interieure du conteneur où sont disponible les fichiers video
  GUACD_PATH_DRIVE:
    type: path
    labe: Emplacement sur hote pour le mappage du partage de fichier
    default: ./data/guacd/drive
  GUACD_PATH_RECORD:
    type: path
    label: Emplacement sur hote pour le stockage des enregistrements des sessions
    default: ./data/guacd/drive