---
name: guacamole

services:
  db:
    image: postgres:18-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    container_name: ${POSTGRESQL_HOSTNAME:-guacamole_db}
    hostname: ${POSTGRESQL_HOSTNAME:-guacamole_db}
    env_file:
      - env/db.env
    networks:
      - guacamole-net 
    volumes:
      - ${POSTGRES_PATH_DATA:-./data/postgresql}:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d

  guacd:
    image: guacamole/guacd:${GUACD_VERSION:-latest}
    container_name: guacd
    hostname: guacd 
    restart: ${RESTART_POLICY:-unless-stopped}
    env_file:
      - env/guacd.env
    networks:
      - guacamole-net
    volumes:
      - ${GUACD_PATH_DRIVE:-./data/guacd/drive}:/drive:rw 
      - ${GUACD_PATH_RECORD:-./data/guacd/record}:/record:rw
    expose:
      - 4822
    
  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION:-latest}
    container_name: guacamole
    hostname: guacamole
    restart: ${RESTART_POLICY:-unless-stopped}
    env_file:
      - env/db.env
      - env/guacamole.env
    networks:
      - guacamole-net
    ports:
      - ${GUACAMOLE_PORT:-8080}:8080
    depends_on:
      - db
      - guacd
    volumes:
      - ${GUACD_PATH_RECORD:-./data/guacd/record}:/record:rw
    environment:
      GUACD_HOSTNAME: ${GUACD_HOSTNAME:-guacd}
      POSTGRESQL_HOSTNAME: ${POSTGRESQL_HOSTNAME:-guacamole_db}
      POSTGRESQL_ENABLED: true

networks:
  guacamole-net:
    name: guacamole-net