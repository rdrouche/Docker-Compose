stack:
  - title: Avec PostgreSQL
  - description: ""
vars:
  POSTGRESQL_HOSTNAME:
    type: text
    label: Nom du conteneur PostgreSQL
    default: guacamole_db
    required: true
  POSTGRES_PATH_DATA:
    type: path 
    default: ./guacamole_db
    label: Emplacement sur hote Docker ou les fichiers PostgreSQL seront stocke (bind-mount)
  POSTGRES_DB:
    type: text
    required: true
    default: guacamole
    services:
      - db
      - guacamole
    group: Postgres
  POSTGRES_USER:
    type: text
    required: true
    default: guacamole
    services:
      - db
      - guacamole
    group: Postgres
  POSTGRES_PASSWORD:
    type: secret
    required: true
    gen: alpha-24
    services:
      - db
      - guacamole
    group: Postgres
  PGDATA:
    type: path 
    required: true 
    default: /var/lib/postgresql/18/docker
    group: Postgres

