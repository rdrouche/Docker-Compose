stack:
  - title: Avec PostgreSQL
  - description: ""
vars:
  POSTGRES_DB:
    type: text
    required: true
    default: guacamole
    services:
      - db
      - guacamole
    group: Postgres
  POSTGRES_USER:
    type: text
    required: true
    default: guacamole
    services:
      - db
      - guacamole
    group: Postgres
  POSTGRES_PASSWORD:
    type: secret
    required: true
    gen: alpha-24
    services:
      - db
      - guacamole
    group: Postgres
  PGDATA:
    type: path 
    required: true 
    default: /var/lib/postgresql/18/docker
    group: Postgres

