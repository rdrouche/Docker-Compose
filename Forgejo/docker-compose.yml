services:
  forge-server:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_TAG:-16}
    container_name: ${FORGE_SERVER_CONTAINER_NAME:-forgejo}
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=${FORGE_SERVER_DB_TYPE:-postgres}
      - FORGEJO__database__HOST=${FORGE_SERVER_DB_HOST:-db:5432}
      - FORGEJO__database__NAME=${POSTGRES_DB:-forgejo}
      - FORGEJO__database__USER=${POSTGRES_USER:-forgejo}
      - FORGEJO__database__PASSWD=${POSTGRES_PASSWORD:?set-database-password}
      - FORGEJO__server__DOMAIN=${FORGE_SERVER_DOMAIN:?set-domain}
      - FORGEJO__server__ROOT_URL=${FORGE_SERVER_ROOT_URL?set-root-url}
      - FORGEJO__server__DISABLE_SSH=${FORGE_SERVER_DISABLE_SSH:-false}
    restart: ${RESTART_POLICY:-always}
    networks:
      - forgejo
    volumes:
      - ./forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGE_SERVER_HTTP_PORT:-3000}:3000"
      - "${FORGE_SERVER_SSH_PORT:-222}:22"
    depends_on:
      - db

  db:
    image: postgres:${POSTGRESQL_TAG:-16-alpine}
    restart: ${RESTART_POLICY:-always}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-forgejo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set-database-password}
      - POSTGRES_DB=${POSTGRES_DB:-forgejo}
    networks:
      - forgejo
    volumes:
      - ./postgres:/var/lib/postgresql/data

networks:
  forgejo:
    external: false
    driver: bridge
    enable_ipv6: false
