stack:
  title: glpi
vars:
  REGISTRY_IMG_GLPI:
    type: select
    default: forge.rdr-it.com/registry/glpi
    options:
      - forge.rdr-it.com/registry/glpi
      - rdrit/glpi
  GLPI_WEB_IMAGE_TAG:
    type: select
    default: latest
    options:
      - glpi-php85
      - glpi-php84
      - glpi-php83
      - latest
  GLPI_DOMAIN:
    type: domain
    label: Nom DNS du service GLPI
    label_en: DNS name of the GLPI service
    required: true
    services:
      - glpi-web
    group: GLPI
    placeholder: glpi.domain.tld
  GLPI_HTTP_PROTOCOLE:
    type: select
    default: https
    required: true
    services:
      - glpi-web
    group: GLPI
    options:
      - http
      - https
  GLPI_VERSION_INSTALL:
    label: Version GLPI installée au premier démarrage
    label_en: GLPI version installed at first startup
    default: 11.0.11
    required: true
    services:
      - glpi-web
    group: GLPI
  GLPI_TIMEZONE:
    default: UTC
    required: true
  MYSQL_ROOT_PASSWORD:
    type: password
    label: Mot de passe du compte root
    required: true
    gen: alpha-24
    services:
      - glpi-db
    group: Database
  GLPI_DB_NAME:
    label: Nom de la base de données
    label_en: GLPI Database name
    default: glpi
    required: true
    services:
      - glpi-web
      - glpi-db
    group: Database
    placeholder: glpi
  GLPI_DB_USER:
    label: Utilisateur MariaDB
    label_en: MariaDB user
    default: glpi
    required: true
    services:
      - glpi-web
      - glpi-db
    group: Database
    placeholder: glpi
  GLPI_DB_PASSWORD:
    type: password
    label: Mot de passe pour utilisateur GLPI_DB_USER
    label_en: Password for GLPI_DB_USER user
    gen: alpha-24
    services:
      - glpi-web
      - glpi-db
    group: Database
  MARIADB_AUTO_UPGRADE:
    type: bool
    default: true
    services:
      - glpi-db
    group: Database
    true_value: "1"
    false_value: "0"
  GLPI_WEB_PORT:
    type: port
    label: Port de publication sur l hôte Docker
    label_en: Port publishing on the Docker host
    default: 80
    required: true
    group: GLPI
  GLPI_REDIS_SERVER:
    label: Nom du service Redis
    label_en: Redis service name
    services:
      - glpi-web
    group: GLPI
    placeholder: glpi-redis
  GLPI_REDIS_ENABLE:
    type: select
    default: No
    services:
      - glpi-web
    group: GLPI
    options:
      - Yes
      - No
  GLPI_TIMEZONE_CONFIG:
    type: select
    label: Configurer les timezones dans GLPI
    label_en: Configuring time zones in GLPI
    default: Yes
    required: true
    services:
      - glpi-web
    group: GLPI
    options:
      - Yes
      - No
