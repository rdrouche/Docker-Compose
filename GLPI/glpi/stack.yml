stack:
  title: glpi
vars:
  REGISTRY_IMG_GLPI:
    type: select
    default: forge.rdr-it.com/registry/glpi
    options:
      - forge.rdr-it.com/registry/glpi
      - rdrit/glpi
  GLPI_DOMAIN:
    type: domain
    label: Nom DNS du service GLPI
    label_en: DNS name of the GLPI service
    required: true
    services:
      - glpi-web
      - glpi-cron
    group: glpi-web
    placeholder: glpi.domain.tld
  GLPI_HTTP_PROTOCOLE:
    type: select
    default: https
    required: true
    services:
      - glpi-web
      - glpi-cron
    group: glpi-web
    options:
      - http
      - https
  GLPI_VERSION_INSTALL:
    label: Version GLPI installée au premier démarrage
    label_en: GLPI version installed at first startup
    default: 11.0.11
    required: true
    services:
      - glpi-web
      - glpi-cron
    group: glpi-web
  GLPI_TIMEZONE:
    default: UTC
    required: true
    services:
      - glpi-web
      - glpi-cron
      - glpi-db
  MYSQL_ROOT_PASSWORD:
    type: password
    label: Mot de passe du compte root
    required: true
    gen: alpha-24
    services:
      - glpi-db
    group: glpi-db
  GLPI_DB_NAME:
    label: Nom de la base de données
    label_en: GLPI Database name
    default: glpi
    required: true
    services:
      - glpi-web
      - glpi-db
      - glpi-cron
    group: glpi-db
    placeholder: glpi
  GLPI_DB_USER:
    label: Utilisateur MariaDB
    label_en: MariaDB user
    default: glpi
    required: true
    services:
      - glpi-web
      - glpi-db
      - glpi-cron
    group: glpi-db
    placeholder: glpi
  GLPI_DB_PASSWORD:
    type: password
    label: Mot de passe pour utilisateur GLPI_DB_USER
    label_en: Password for GLPI_DB_USER user
    gen: alpha-24
    services:
      - glpi-web
      - glpi-db
      - glpi-cron
    group: glpi-db
  MARIADB_AUTO_UPGRADE:
    type: bool
    default: true
    services:
      - glpi-db
    true_value: "1"
    false_value: "0"
groups: { glpi-web:, glpi-cron:, glpi-db: }
