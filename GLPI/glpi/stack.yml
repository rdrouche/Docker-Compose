stack:
  title: glpi
vars:
  GLPI_DOMAIN:
    type: domain
    label: Nom DNS du service GLPI
    label_en: DNS name of the GLPI service
    default: glpi-web,glpi-cron
    required: true
    group: glpi-web
    placeholder: glpi.domain.tld
  GLPI_HTTP_PROTOCOLE:
    type: select
    default: https
    required: true
    services:
      - glpi-web
      - glpi-cron
    group: glpi-web
    options:
      - http
      - https
  GLPI_VERSION_INSTALL:
    label: Version GLPI installée au premier démarrage
    label_en: GLPI version installed at first startup
    default: 11.0.11
    required: true
    services:
      - glpi-web
      - glpi-cron
    group: glpi-web
  MYSQL_ROOT_PASSWORD:
    type: password
    label: Mot de passe du compte root
    required: true
    gen: alpha-24
    services:
      - glpi-db
    group: glpi-db
groups: { glpi-web:, glpi-cron:, glpi-db: }
