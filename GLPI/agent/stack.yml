stack:
  - title: GLPI Agent
  - description: ""

vars:
  IMAGE_AGENT_TAG:
    type: text 
    default: latest
    requird: true
  IMAGE_AGENT:
    type: select
    options:
      - { value: "forge.rdr-it.com/registry/glpi-agent",          label: "forge.rdr-it.com/registry/glpi-agent" }
      - { value: "rdrit/glpi-agent",                              label: "rdrit/glpi-agent" }
    default: forge.rdr-it.com/registry/glpi-agent
    required: true
  AGENT_PORT_HTTP:
    type: port 
    default: 62354
    required: true
  GLPI_SERVER:
    type: url
    label: adresse du serveur GLPI
    label_en: GLPI server address
    placeholder: https://glpi.domain.tld
    required: true 
  GLPI_SERVER_NO_SSL_CHECK:
    type: bool
    required: true
    default: true
    label: désactiver la vérification du certificat https lors de l'envoie de l'inventaire vers le serveur GLPI.
    label_en: Disable HTTPS certificate verification when sending the inventory to the GLPI server.
  GLPI_AGENT_TAG:
    type: text
    label: Tag de l'image de l'agent GLPI
    label_en: GLPI agent image tag
    required: true
    default: latest
  GLPI_SERVER_SSL_FINGER_PRINT:
    type: text
    label: Empreinte SSL du serveur
    label_en: Server SSL fingerprint
    default: ""
  GLPI_TAG:
    type: text
    label: Tag pour l’agent pour l'inventaire
    label_en: Tag for the inventory agent
    default: docker-glpi-agent
  GLPI_DEBUG:
    type: bool
    default: false
    label: Activer le mode debug
    label_en: Enable debug mode
  GLPI_HTTPD:
    type: bool
    default: true
    label: Activer le serveur web intégré
    label_en: Enable the built-in web server
  GLPI_HTTPD_PORT:
    type: port 
    default: 62354
    label: Port du serveur web intégré
    label_en: Integrated web server port
  GLPI_TOOLBOX_ENABLE:
    type: bool
    default: 1
    label: Activer le plugin Toolbox
    label_en: Activate the Toolbox plugin
  GLPI_TOOLBOX_AUTH_ENABLE:
    type: bool
    default: false
    label: Activer l’authentification du plugin Toolbox
    label_en: Enable authentication for the Toolbox plugin
  GLPI_TOOLBOX_AUTH_USER:
    type: text
    default: "" 
    label: Nom d'utilisateur pour l'authentification Toolbox
    label_en: Username for Toolbox authentication
  GLPI_TOOLBOX_AUTH_PASSWORD:
    type: text 
    default: ""
    label: Mot de passe pour l’authentification Toolbox
    label_en: Password for Toolbox authentication
  GLPI_TOOLBOX_AUTH_PORT:
    type: port
    default: 62354
    label: Port pour l’authentification Toolbox
    label_en: Port for Toolbox authentication