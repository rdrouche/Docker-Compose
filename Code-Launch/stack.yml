app:
  name: Code Launch
  description: Lanceur d'espace VSCode à la demande, Traefik est requis pour la publication automatique des espace VSCode et un serveur SMTP est requis si utilisation des "Magic Link" pour la connexion utilisateur
  tags:
    - vscode
    - sso
    - traefik
    - openid

vars:
  APP_PUBLIC_URL:
    type: url
    label: URL interface administration et espace utilisateur
    description: URL interface Administration et espace utilisateur, exemple https://code.domain.tld (Cette url peut etre commune avec BASE_URI)
    required: true
    placeholder: https://codes.domain.tld
  BASE_UI_DOMAIN:
    type: domain
    label: Domain de l'interface administration et espace utilisateur
    required: true
    placeholder: codes.domain.tld
  BASE_URI:
    type: domain 
    label: Domaine de publication des espaces VSCode
    required: true 
    placeholder: codes.domain.tld
  DOCKER_NETWORK:
    type: text
    label: Nom du reseau Traefik pour attache les espaces VSCode
    required: true
    placeholder: traefik
  CODE_SERVER_DATA_PATH:
    type: path 
    label: Chemin absolue sur l'hôte de Docker où les données des espaces VScode est stockés (données utilisateurs)
    required: true
    placeholder: /containers/codelaunch/vscode_data
  CODE_SERVER_PASSWD_PATH:
    type: path
    label: Chemin absolue sur l'hôte de Docker où les fichiers de mot de passe d'accès VSCode sont stockés 
    required: true
    placeholder: /var/lib/code-server
  # ADMIN
  ADMIN_USERNAME:
    type: text
    label: identifiant du compte administrateur par défaut
    required: true
    default: admin 
    placeholder: admin 
  ADMIN_PASSWORD:
    type: secret
    label: Mot de passe du compte admin, une fois le SSO en place peut etre désactiver avec ADMIN_LOCAL_LOGIN=false
    required: true
  ADMIN_SESSION_SECRET:
    type: text 
    label: Chaîne aléatoire (32 caractères minimum). Sert à signer les sessions et à chiffrer les mots de passe permanents des espaces et les secrets enregistrés. Le changer rend illisibles les mots de passe permanents et secrets déjà enregistrés.
    required: true
    gen: openssl-rand-hex-32
  # Config
  APP_PORT:
    type: port 
    default: 3000


  
  
