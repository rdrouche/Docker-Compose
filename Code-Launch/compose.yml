# https://rdr-it.com/docker-compose/#Code-Launch
---
name: codelaunch

services:
  backend:
    image: docker pull forge.rdr-it.com/romain/docker-compose/code-launch:${BACKEND_TAG:-latest}
    container_name: codelaunch-backend
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./codelaunch-data:/data
      - ${CODE_SERVER_DATA_PATH:-/code-server-data}:${CODE_SERVER_DATA_PATH:-/code-server-data}
      - ${CODE_SERVER_PASSWD_PATH:-/var/lib/code-server}:${CODE_SERVER_PASSWD_PATH:-/var/lib/code-server}
    networks:
      - ${DOCKER_NETWORK:-proxy}
      - codelaunch-internal
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${DOCKER_NETWORK:-proxy}"
      traefik.http.routers.codelaunch.rule: "Host(`${BASE_UI_DOMAIN:-launch.example.com}`)"
      traefik.http.routers.codelaunch.tls: "true"
      traefik.http.routers.codelaunch.entrypoints: "websecure"
      traefik.http.routers.codelaunch.service: "codelaunch"
      traefik.http.services.codelaunch.loadbalancer.server.port: "${APP_PORT:-3000}"

networks:
  ${DOCKER_NETWORK:-proxy}:
    external: true
    name: ${DOCKER_NETWORK:-proxy}
  codelaunch-internal:
    name: codelaunch-internal
